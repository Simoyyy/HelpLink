name: helplink
description: HelpLink - Community Assistance Application connecting donors with beneficiaries.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_messaging: ^16.1.1

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2

  # State Management
  provider: ^6.1.2

  # Utils
  intl: ^0.20.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_maps_flutter: ^2.10.0
  google_generative_ai: 0.4.7
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  firebase_storage: ^13.0.6
  cloud_functions: ^6.2.0
  record: ^6.0.0
  lottie: ^3.1.0
  cached_network_image: ^3.4.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  shared_preferences: ^2.3.2
  http: ^1.2.2
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/lottie/
    - assets/images/
