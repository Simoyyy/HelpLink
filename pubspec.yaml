name: helplink
description: HelpLink - Community Assistance Application connecting donors with beneficiaries.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_messaging: ^16.1.1

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2

  # State Management
  provider: ^6.1.2

  # Utils
  intl: ^0.20.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_maps_flutter: ^2.10.0
  google_generative_ai: 0.4.7
  image_picker: ^1.1.2
  firebase_storage: ^13.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
